    <style>
        @import url('');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Amiri', serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 25%, #4caf50 50%, #81c784 75%, #c8e6c9 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية متحركة مع نجوم */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideInFromTop 1.2s ease-out;
        }

        .main-title {
            font-size: clamp(28px, 7vw, 36px);
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                0 0 40px rgba(76, 175, 80, 0.3),
                2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: clamp(16px, 4.5vw, 20px);
            color: #e8f5e8;
            font-weight: 400;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
        }

        .message-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out 0.4s both;
            position: relative;
            overflow: hidden;
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .card-title {
            font-size: clamp(20px, 5.5vw, 24px);
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .daily-message {
            font-size: clamp(17px, 4.8vw, 20px);
            color: #f0f8f0;
            line-height: 1.9;
            text-align: center;
            font-weight: 400;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
            font-style: italic;
        }

        .share-button {
            display: block;
            width: 70%;
            margin: 20px auto 0;
            background: linear-gradient(45deg, #4caf50, #81c784);
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            color: #fff;
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            position: relative;
            z-index: 2;
            font-family: inherit;
        }

        .share-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
            background: linear-gradient(45deg, #66bb6a, #a5d6a7);
        }

        .share-button:active {
            transform: translateY(-1px);
        }

        .countdown-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            padding: 30px 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .time-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            border-radius: 20px;
            padding: 20px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .time-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: rotate 6s linear infinite;
            z-index: 1;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .time-box:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }

        .time-number {
            font-size: clamp(26px, 8vw, 34px);
            font-weight: 700;
            color: #fff;
            display: block;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 2;
        }

        .time-label {
            font-size: clamp(13px, 3.8vw, 15px);
            color: #e8f5e8;
            margin-top: 8px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .floating-heart {
            position: absolute;
            font-size: 24px;
            animation: floatUp 8s linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(45deg, #4caf50, #81c784);
            color: #fff;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
            z-index: 1000;
            transform: translateY(-100px);
            transition: transform 0.4s ease;
            font-weight: 600;
            text-align: center;
            font-size: clamp(13px, 3.8vw, 15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .notification.show {
            transform: translateY(0);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* الأنيميشن */
        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

                margin-bottom: 20px;
            }
            
            .countdown-grid {

            }
            
            .time-box {

            }

            .header {
                margin-bottom: 20px;
            }

                padding: 20px;
                margin-bottom: 15px;
            }
        }

        .glow {
            filter: drop-shadow(0 0 10px rgba(76, 175, 80, 0.5));
        }

        .card-hover:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
    </style>

    "يا أمي العزيزة، بقربك يلين الحديد وتعبر العواصف.",
    "أمي الطيبة، كل نجاح أحمله على كتفيك.",
    "يا أحن أم، أطارد أحلامي بدعائك خلفي.",
    "ماما العزيزة، في عينيك أجمل تعريف للأمان.",
    "أمي الغالية، على يديك تعلمت لغة الطمأنينة.",
    "يا أمي الحنونة، حين أضعف تذكرينني أن الله معي.",
    "أمي، لا غيمة مع ابتسامتك.",
    "ماما، قلبك بحر لا ينضب عطاؤه.",
    "يا أمي الرقيقة، أعِدك أن أواصل الطريق بثبات.",
    "أمي القريبة من القلب، خطاي تثبت حين تذكرين اسمي بدعاء.",
    "ماما يا نبض الروح، كل صباح يبدأ باسمك أجمل.",
    "أمي يا ملاذي، رضاك جسرٌ إلى توفيقي.",
    "يا أمي يا بهجة البيت، حنانك شفاءٌ لا يوصف بالكلمات.",
];

        // إعدادات عيد الميلاد
        const BIRTHDAY_MONTH = 2; // يناير
        const BIRTHDAY_DAY = 27;

        let countdownInterval;
        let birthdayDate;
        let currentMessage = '';

        // حساب تاريخ عيد الميلاد القادم
        function calculateNextBirthday() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let birthday = new Date(currentYear, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY);
            
            if (birthday <= now) {
                birthday.setFullYear(currentYear + 1);
            }
            
            return birthday;
        }

        // إنشاء النجوم
        function createStars() {
            const starsContainer = document.getElementById('starsContainer');
            const numberOfStars = 50;
            
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // إنشاء القلوب المتحركة
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 10 + 20) + 'px';
            heart.style.animationDelay = Math.random() * 2 + 's';
            
            const heartSymbols = ['🌸', '🌺', '💖', '🌹', '💕', '🌻'];
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            document.getElementById('heartsContainer').appendChild(heart);

            setTimeout(() => {
                if (heart.parentNode) {
                    heart.remove();
                }
            }, 8000);
        }

        setInterval(createFloatingHeart, 2000);

        // وظيفة العد التنازلي
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = birthdayDate - now;

            if (distance < 0) {
                document.getElementById('dailyMessage').innerHTML = "🎉 عيد ميلاد سعيد أمي الغالية! 🎉<br>كل عام وأنت بألف خير وصحة وسعادة";
                clearInterval(countdownInterval);
                showNotification('🎂 عيد ميلاد سعيد لأعز أم في الوجود! 🎂');
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;

            // اختيار الرسالة بناءً على الأيام المتبقية
            const messageIndex = days % dailyMessages.length;
            currentMessage = dailyMessages[messageIndex];
            document.getElementById('dailyMessage').textContent = currentMessage;
        }

        // مشاركة الرسالة
        function shareMessage() {
            if (!currentMessage) {
                showNotification('لا توجد رسالة للمشاركة!');
                return;
            }

            const shareText = `${currentMessage}\n\n🌸 مع كل الحب والامتنان لأغلى أم`;

            if (navigator.share) {
                navigator.share({
                    title: 'رسالة جميلة لأمي الحبيبة',
                    text: shareText,
                    url: window.location.href
                }).then(() => {
                    showNotification('تم مشاركة الرسالة بنجاح! 📱');
                }).catch(() => {
                    copyToClipboard(shareText);
                });
            } else {
                copyToClipboard(shareText);
            }
        }

        // نسخ النص للحافظة
        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('تم نسخ الرسالة! يمكنك مشاركتها الآن 📋');
                }).catch(() => {
                    fallbackCopyToClipboard(text);
                });
            } else {
                fallbackCopyToClipboard(text);
            }
        }

        // نسخ احتياطي للحافظة
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showNotification('تم نسخ الرسالة! يمكنك مشاركتها الآن 📋');
            } catch (err) {
                showNotification('لم يتم النسخ! جرب مرة أخرى');
            }
            
            document.body.removeChild(textArea);
        }

        // عرض الإشعارات
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        // إضافة تأثيرات تفاعلية
        function addInteractiveEffects() {
            const timeBoxes = document.querySelectorAll('.time-box');
            
            timeBoxes.forEach(box => {
                box.addEventListener('click', function() {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });

            // تأثير الاهتزاز للإشعارات (إذا كان متاحاً)
            const originalShowNotification = window.showNotification;
            window.showNotification = function(message) {
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
                originalShowNotification(message);
            };
        }

        // بدء العداد عند تحميل الصفحة
        window.addEventListener('load', function() {
            birthdayDate = calculateNextBirthday().getTime();
            countdownInterval = setInterval(updateCountdown, 1000);
            updateCountdown();
            
            createStars();
            addInteractiveEffects();
            
            setTimeout(() => {
                showNotification('مرحباً بك في موقع الحب والامتنان ✨');
            }, 1500);
        });

        // تحسين الأداء - إيقاف الأنيميشن عند عدم رؤية الصفحة
        document.addEventListener('visibilitychange', function() {
            const hearts = document.querySelectorAll('.floating-heart');
            const stars = document.querySelectorAll('.star');
            
            if (document.hidden) {
                hearts.forEach(heart => heart.style.animationPlayState = 'paused');
                stars.forEach(star => star.style.animationPlayState = 'paused');
            } else {
                hearts.forEach(heart => heart.style.animationPlayState = 'running');
                stars.forEach(star => star.style.animationPlayState = 'running');
            }
        });
    </script>
</body>
</html>
